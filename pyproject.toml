[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-price-tracker"
version = "0.1.0"
description = "Local, compliant camera and lens price monitoring"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "APScheduler>=3.10,<4",
  "plyer>=2.1,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
camera_tracker = ["web/*.html"]
